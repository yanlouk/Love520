<!--
功能：520浪漫3D倾斜漂浮网页（移动端流畅优化版）
特点：
- 修复右侧竖边
- 手机/微信流畅优化
- 保留3D空间倾斜感
- 降低GPU压力
-->

<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Love</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    position:relative;

    background:
    radial-gradient(circle at center,
    #4b0055 0%,
    #220022 45%,
    #120018 100%);

    font-family:
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

    perspective:1600px;
    -webkit-perspective:1600px;

    overflow:hidden;
}

/* =========================
   3D空间容器（修复边界）
========================= */

.container{

    position:absolute;

    width:140vw;
    height:140vh;

    left:-20vw;
    top:-20vh;

    overflow:hidden;

    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;

    /* 手机更明显的倾斜 */
    transform:
        rotateY(38deg)
        rotateX(14deg);

    will-change:transform;
}

/* =========================
   漂浮文字
========================= */

.word{

    position:absolute;

    white-space:nowrap;

    font-weight:bold;

    color:#ff8de9;

    opacity:0;

    text-shadow:
        0 0 6px #ff4fd8,
        0 0 18px #ff4fd8,
        0 0 36px #ff4fd8;

    animation:float3d linear forwards;

    will-change:transform,opacity;

    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
}

/* =========================
   3D漂浮动画
========================= */

@keyframes float3d{

    0%{

        transform:
            perspective(1200px)
            translate3d(120px,120vh,-1200px)
            rotateY(-35deg)
            rotateX(25deg)
            scale(0.25);

        opacity:0;

        filter:blur(3px);
    }

    15%{
        opacity:1;
    }

    60%{
        filter:blur(0px);
    }

    100%{

        transform:
            perspective(1200px)
            translate3d(-220px,-130vh,700px)
            rotateY(25deg)
            rotateX(10deg)
            scale(2.1);

        opacity:0;
    }
}

/* =========================
   爱心
========================= */

.heart{

    position:absolute;

    color:pink;

    opacity:0.5;

    filter:blur(0.5px);

    animation:heartFloat linear infinite;

    will-change:transform,opacity;

    backface-visibility:hidden;
}

@keyframes heartFloat{

    0%{

        transform:
            translate3d(0,100vh,-500px)
            scale(0.3);

        opacity:0;
    }

    20%{
        opacity:0.8;
    }

    100%{

        transform:
            translate3d(-180px,-120vh,500px)
            scale(1.8);

        opacity:0;
    }
}

/* =========================
   星空背景
========================= */

.star{

    position:absolute;

    width:2px;
    height:2px;

    background:white;

    border-radius:50%;

    opacity:0.7;

    animation:twinkle infinite;

    will-change:opacity;
}

@keyframes twinkle{

    0%{
        opacity:0.2;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0.2;
    }
}

/* =========================
   粉色迷雾（性能优化）
========================= */

.fog{

    position:absolute;

    width:500px;
    height:500px;

    background:
    radial-gradient(circle,
    rgba(255,80,220,0.14),
    transparent 70%);

    border-radius:50%;

    filter:blur(35px);

    opacity:0.6;

    animation:fogMove 16s ease-in-out infinite;
}

@keyframes fogMove{

    0%{
        transform:
        translate(-10%,-10%);
    }

    50%{
        transform:
        translate(10%,10%);
    }

    100%{
        transform:
        translate(-10%,-10%);
    }
}

</style>

</head>

<body>

<div class="container" id="container">

    <div class="fog"></div>

</div>

<script>

/* =========================
   漂浮文字内容
========================= */

const texts = [

    "我喜欢你",
    "爱你",
    "520快乐",
    "I love you",
    "和我在一起吧",
    "遇见你很高兴",
    "莹莹天天开心",
    "莹莹长命百岁"

];

const container =
document.getElementById("container");

/* =========================
   创建漂浮文字
========================= */

function createWord(){

    const div =
    document.createElement("div");

    div.className = "word";

    div.innerText =
        texts[Math.floor(
        Math.random()*texts.length)];

    /* 空间位置 */

    div.style.left =
        Math.random()*140 - 20 + "vw";

    div.style.top =
        Math.random()*140 - 20 + "vh";

    /* 字体大小 */

    div.style.fontSize =
        18 + Math.random()*42 + "px";

    /* 动画时间 */

    const duration =
        7 + Math.random()*8;

    div.style.animationDuration =
        duration + "s";

    /* 随机空间深度 */

    const z =
    Math.random()*1600 - 800;

    div.style.transform =
        `translateZ(${z}px)`;

    /* 景深模糊 */

    const blur =
    Math.abs(z)/700;

    div.style.filter =
        `blur(${blur}px)`;

    container.appendChild(div);

    setTimeout(()=>{

        div.remove();

    },duration*1000);
}

/* 手机优化后的生成频率 */
setInterval(createWord,320);

/* =========================
   创建爱心
========================= */

function createHeart(){

    const heart =
    document.createElement("div");

    heart.className = "heart";

    heart.innerHTML = "❤";

    heart.style.left =
        Math.random()*100 + "vw";

    heart.style.fontSize =
        18 + Math.random()*50 + "px";

    heart.style.animationDuration =
        6 + Math.random()*6 + "s";

    container.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },12000);
}

setInterval(createHeart,700);

/* =========================
   创建星空
========================= */

function createStar(){

    const star =
    document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random()*100 + "vw";

    star.style.top =
        Math.random()*100 + "vh";

    star.style.animationDuration =
        1 + Math.random()*4 + "s";

    star.style.opacity =
        0.2 + Math.random()*0.8;

    container.appendChild(star);
}

/* 星星数量减少（优化） */
for(let i=0;i<70;i++){

    createStar();
}

</script>

</body>

</html>
