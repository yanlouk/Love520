<!--
功能：520浪漫3D空间穿透隧道版
效果：文字穿越屏幕 + 深度空间漂浮
-->

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Space</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;

    background:
        radial-gradient(circle at center,
        #4b0055 0%,
        #1a001f 50%,
        #0b0010 100%);

    perspective:1400px;
    -webkit-perspective:1400px;

    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
}

/* =========================
   容器（空间镜头）
========================= */

.container{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;

    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;

    transform: rotateY(25deg) translateX(-8%);
    -webkit-transform: rotateY(25deg) translateX(-8%);

    animation: breathe 6s ease-in-out infinite;
}

/* 镜头呼吸 */
@keyframes breathe {
    0%   { transform: rotateY(25deg) translateX(-8%); }
    50%  { transform: rotateY(30deg) translateX(-6%); }
    100% { transform: rotateY(25deg) translateX(-8%); }
}

/* =========================
   漂浮文字（空间穿透）
========================= */

.word{
    position:absolute;
    white-space:nowrap;
    font-weight:bold;

    color:#ff7ad9;

    text-shadow:
        0 0 6px #ff4fd8,
        0 0 18px #ff4fd8,
        0 0 40px #ff2fcf;

    opacity:0;

    animation:flyThrough linear forwards;

    will-change: transform, opacity;
}

/* 空间穿透动画 */
@keyframes flyThrough {

    0%{
        transform:
            translate3d(0,120vh,-1200px)
            scale(0.2);
        opacity:0;
        filter:blur(4px);
    }

    15%{
        opacity:1;
    }

    60%{
        filter:blur(0px);
    }

    100%{
        transform:
            translate3d(-120px,-140vh,800px)
            scale(2.2);
        opacity:0;
    }
}

/* =========================
   爱心
========================= */

.heart{
    position:absolute;
    color:pink;
    opacity:0.5;
    filter:blur(1px);

    animation:heartFly linear infinite;
}

@keyframes heartFly{
    0%{
        transform:translate3d(0,100vh,-600px) scale(0.3);
        opacity:0;
    }
    20%{ opacity:0.8; }
    100%{
        transform:translate3d(-200px,-120vh,600px) scale(2);
        opacity:0;
    }
}

/* =========================
   星星
========================= */

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0.6;

    animation:twinkle infinite;
}

@keyframes twinkle{
    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}

</style>
</head>

<body>

<div class="container" id="container"></div>

<script>

const container = document.getElementById("container");

const texts = [
    "我喜欢你",
    "爱你",
    "520快乐",
    "I love you",
    "和我在一起吧",
    "遇见你很高兴",
    "莹莹天天开心",
    "莹莹长命百岁"
];


// =========================
// 空间文字生成
// =========================

function createWord(){

    const div = document.createElement("div");
    div.className = "word";

    div.innerText =
        texts[Math.floor(Math.random() * texts.length)];

    // 空间位置
    const x = Math.random() * 120 - 10;
    const y = Math.random() * 120 - 10;
    const z = Math.random() * 2000 - 1000;

    div.style.left = x + "vw";
    div.style.top = y + "vh";

    // 动画时间（远近速度不同）
    const speed = (z < 0 ? 1.3 : 0.8);
    const duration = (6 + Math.random() * 6) * speed;

    div.style.animationDuration = duration + "s";

    // 初始深度
    div.style.transform = `translateZ(${z}px)`;

    // 模糊（距离感）
    const blur = Math.abs(z) / 600;
    div.style.filter = `blur(${blur}px)`;

    container.appendChild(div);

    setTimeout(()=>div.remove(), duration * 1000);
}

setInterval(createWord, 160);


// =========================
// 爱心
// =========================

function createHeart(){

    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = 20 + Math.random() * 60 + "px";
    heart.style.animationDuration = 6 + Math.random() * 8 + "s";

    container.appendChild(heart);

    setTimeout(()=>heart.remove(), 14000);
}

setInterval(createHeart, 500);


// =========================
// 星星
// =========================

function createStar(){

    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.animationDuration = 1 + Math.random() * 5 + "s";

    container.appendChild(star);
}

for(let i=0;i<160;i++){
    createStar();
}

</script>

</body>
</html>
